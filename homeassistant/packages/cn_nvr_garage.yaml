# cn-nvr — Home Assistant package: Frigate known-plate arrival -> garage.
# Deployed by homeassistant/deploy-ha.sh into
# /usr/share/hassio/homeassistant/packages/ (loaded via `homeassistant:
# packages: !include_dir_named packages`). __NOTIFY_SERVICE__ is replaced at
# deploy time (default notify.mobile_app_iphone18gon).
#
# Arming: input_boolean.nvr_garage_auto_open_armed is the kill switch (state
# survives restarts). Off = shadow mode: every recognised plate is recorded
# and pushed, the door is never touched. On = the arrival automation calls
# script.nvr_garage_safe_open when every guard below passes.
#
# "Opened by HA" contract (input_boolean.nvr_garage_opened_by_ha):
#   * the opener script sets it before it touches the door and blocks the
#     controller for the whole HA-driven open: ratgdo "Lock remotes" is
#     engaged first (confirmed, else abort) and only released once the door
#     reports fully open (or 30 s), so a visor-remote press cannot stop or
#     reverse the door mid-travel;
#   * while it is on, the arrival automation refuses to fire again;
#   * it clears itself when the door reports closed (automation below).
# A safety automation releases the remote lock if anything leaves it engaged
# for more than a minute.
#
# Other guards on the opener branch: door must have been closed for at least
# departure_guard_s (a late plate read of the car you just drove away in must
# not reopen the house), the same Frigate tracked object never opens twice,
# 2-minute opener cooldown, opener not already running.
#
# Signals from Frigate (MQTT frigate/tracked_object_update, type=lpr):
#   name   known-plate label from lpr.known_plates (null for unknown plates)
#   id     Frigate tracked-object id; score OCR confidence 0..1; plate,
#   camera, timestamp
# Departure -> close (2026-10-24, input_boolean.nvr_garage_auto_close_armed,
# shipped OFF = shadow mode):
#   "leaving" = sensor.frigate_gonzalo_car_last_camera (Frigate integration,
#   fed by the same LPR reads) flips PTZ -> Driveway: the PTZ dome reads the
#   plate while the car backs out with the door open, then the driveway camera
#   reads it on the way down. Every real departure 2026-10-14..17 produced
#   exactly that transition within 10-70 s; arrivals never do (the driveway
#   camera reads first). Guards: transition within 5 min, door open, no HA
#   arrival cycle (opened_by_ha off), no obstruction, PTZ camera quiet
#   (Frigate motion off, which already implies mqtt_off_delay 30 s of no
#   motion, and no person) for up to 3 min. The opener's safety beam stays the
#   last line of defence. Off = notify "would close", never touch the door.
# Later second factors (see README): zone occupancy
# (binary_sensor.<camera>_<zone>_car_occupancy once zones exist) and a Frigate
# vehicle-identity classifier.

input_boolean:
  nvr_garage_auto_open_armed:
    name: "NVR: auto-open garage on known plate"
    icon: mdi:garage-open
  nvr_garage_opened_by_ha:
    name: "NVR: garage opened by HA (clears when it closes)"
    icon: mdi:robot
  nvr_garage_auto_close_armed:
    name: "NVR: auto-close garage after known-plate departure"
    icon: mdi:garage-lock

input_number:
  nvr_lpr_min_score:
    name: "NVR: LPR minimum score"
    icon: mdi:car-search
    min: 0.5
    max: 1.0
    step: 0.01
    # tuning knob; deliberately resets to the designed default on restart
    initial: 0.95

input_text:
  nvr_last_plate_event:
    name: "NVR: last known-plate event"
    icon: mdi:license
    max: 255
  nvr_last_plate_object_id:
    name: "NVR: Frigate object that last opened the garage"
    icon: mdi:identifier
    max: 64
  nvr_last_departure_event:
    name: "NVR: last known-plate departure"
    icon: mdi:car-arrow-right
    max: 255

script:
  nvr_garage_safe_open:
    alias: "NVR: safe garage open (block remotes -> open -> release)"
    icon: mdi:garage-open-variant
    mode: single
    sequence:
      # Latch first: from here on "HA is driving the door".
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.nvr_garage_opened_by_ha
      - action: lock.lock
        target:
          entity_id: lock.ratgdo32_9a2c58_lock_remotes
      # Do not move the door until the opener confirms the remotes are
      # blocked (measured ~0.2 s); a silent ratgdo means abort, never race.
      - wait_template: "{{ is_state('lock.ratgdo32_9a2c58_lock_remotes', 'locked') }}"
        timeout: "00:00:05"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.nvr_garage_opened_by_ha
          - action: persistent_notification.create
            data:
              notification_id: nvr_garage_opener
              title: "NVR garage opener aborted"
              message: "ratgdo did not confirm the remote lock within 5 s; the door was left untouched."
          - stop: "remotes not confirmed locked"
            error: true
      - action: cover.open_cover
        target:
          entity_id: cover.ratgdo32_9a2c58_door
      # Remotes stay blocked until the door reports fully open (or 30 s).
      - wait_template: "{{ is_state('cover.ratgdo32_9a2c58_door', 'open') }}"
        timeout: "00:00:30"
        continue_on_timeout: true
      - action: lock.unlock
        target:
          entity_id: lock.ratgdo32_9a2c58_lock_remotes
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: nvr_garage_opener
              title: "NVR garage opener"
              message: "The door did not report open within 30 s of the HA open command (state: {{ states('cover.ratgdo32_9a2c58_door') }}). Remotes released."

automation:
  - id: nvr_remote_lock_safety_reset
    alias: "NVR: remote-lock safety reset"
    description: "Never leave the wireless remotes blocked for more than a minute."
    mode: single
    triggers:
      - trigger: state
        entity_id: lock.ratgdo32_9a2c58_lock_remotes
        to: "locked"
        for: "00:01:00"
    actions:
      - action: lock.unlock
        target:
          entity_id: lock.ratgdo32_9a2c58_lock_remotes

  - id: nvr_garage_opened_by_ha_clear
    # HA derives the entity id from the alias, so keep it aligned with the id.
    alias: "NVR: garage opened-by-HA clear"
    description: "The HA-open cycle ends when the door reports closed (also covers a restart while it was open)."
    mode: single
    triggers:
      - trigger: state
        entity_id: cover.ratgdo32_9a2c58_door
        to: "closed"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.nvr_garage_opened_by_ha

  - id: nvr_known_plate_arrival
    alias: "NVR: known plate arrival"
    description: "Frigate recognised a known plate on a driveway camera: notify; open the garage when armed and every guard passes."
    mode: single
    max_exceeded: silent
    variables:
      known_name: gonzalo_car
      allowed_cameras:
        - driveway
        - ptz
      # the door must have been closed at least this long (seconds)
      departure_guard_s: 180
    triggers:
      - trigger: mqtt
        topic: frigate/tracked_object_update
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json is defined
             and trigger.payload_json.type == 'lpr'
             and trigger.payload_json.name == known_name
             and (trigger.payload_json.score | float(0)) >= (states('input_number.nvr_lpr_min_score') | float(0.95))
             and trigger.payload_json.camera in allowed_cameras }}
    actions:
      - variables:
          object_id: "{{ trigger.payload_json.id | default('') }}"
          pct: "{{ ((trigger.payload_json.score | float(0)) * 100) | round(0) | int }}"
          armed: "{{ is_state('input_boolean.nvr_garage_auto_open_armed', 'on') }}"
          door_closed_s: >-
            {{ (now() - states.cover.ratgdo32_9a2c58_door.last_changed).total_seconds() | int
               if is_state('cover.ratgdo32_9a2c58_door', 'closed') else -1 }}
          # empty string = every guard passed; otherwise the first reason not to open
          blocker: >-
            {%- set door = states('cover.ratgdo32_9a2c58_door') -%}
            {%- set lt = state_attr('script.nvr_garage_safe_open', 'last_triggered') -%}
            {%- if not armed -%} shadow mode
            {%- elif is_state('input_boolean.nvr_garage_opened_by_ha', 'on') -%} HA already opened the door
            {%- elif door != 'closed' -%} door is {{ door }}
            {%- elif door_closed_s < departure_guard_s -%} door closed only {{ door_closed_s }}s ago (departure guard)
            {%- elif object_id != '' and object_id == states('input_text.nvr_last_plate_object_id') -%} tracked object {{ object_id }} already opened the door
            {%- elif is_state('script.nvr_garage_safe_open', 'on') -%} opener already running
            {%- elif lt is not none and (now() - lt).total_seconds() < 120 -%} opener cooldown
            {%- endif -%}
          will_open: "{{ blocker == '' }}"
          summary: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} {{ trigger.payload_json.plate }}
            {{ pct }}% @{{ trigger.payload_json.camera }}
            armed={{ armed }} {{ 'OPENING' if will_open else 'no-open: ' ~ blocker }}
      - action: input_text.set_value
        target:
          entity_id: input_text.nvr_last_plate_event
        data:
          value: "{{ summary[:255] }}"
      - action: __NOTIFY_SERVICE__
        data:
          title: "Known plate at {{ trigger.payload_json.camera }}"
          message: >-
            {{ trigger.payload_json.plate }} ({{ pct }}%) —
            {{ 'opening the garage' if will_open else 'not opening: ' ~ blocker }}
      - action: persistent_notification.create
        data:
          notification_id: "nvr_plate_{{ trigger.payload_json.camera }}"
          title: "NVR known plate"
          message: "{{ summary }}"
      - if:
          - condition: template
            value_template: "{{ will_open }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.nvr_last_plate_object_id
            data:
              value: "{{ object_id[:64] }}"
          - action: script.nvr_garage_safe_open

  - id: nvr_known_plate_departure
    # HA derives the entity id from the alias, so keep it aligned with the id.
    alias: "NVR: known plate departure"
    description: "The known car was read by the PTZ dome and then by the driveway camera: the car is leaving. Close the garage once the PTZ camera is quiet, when armed and every guard passes."
    mode: single
    max_exceeded: silent
    variables:
      # the PTZ read must be this recent for the driveway read to count as leaving
      departure_window_s: 300
    triggers:
      - trigger: state
        entity_id: sensor.frigate_gonzalo_car_last_camera
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state | lower == 'ptz'
             and trigger.to_state.state | lower == 'driveway'
             and (now() - trigger.from_state.last_changed).total_seconds() <= departure_window_s }}
    actions:
      - variables:
          armed: "{{ is_state('input_boolean.nvr_garage_auto_close_armed', 'on') }}"
          # empty string = the door may be closed once the PTZ camera is quiet
          hard_blocker: >-
            {%- set door = states('cover.ratgdo32_9a2c58_door') -%}
            {%- if door != 'open' -%} door is {{ door }}
            {%- elif is_state('input_boolean.nvr_garage_opened_by_ha', 'on') -%} HA arrival cycle in progress
            {%- elif is_state('binary_sensor.ratgdo32_9a2c58_obstruction', 'on') -%} obstruction reported
            {%- endif -%}
      # "No movement on the PTZ camera": Frigate's motion sensor stays on for
      # mqtt_off_delay (30 s) after the last motion, so off already means a
      # quiet scene; a person standing still in view also blocks. A hard
      # blocker makes the template true at once so nothing waits for nothing.
      - wait_template: >-
          {{ hard_blocker != ''
             or (is_state('binary_sensor.ptz_motion', 'off')
                 and is_state('binary_sensor.ptz_person_occupancy', 'off')) }}
        timeout: "00:03:00"
        continue_on_timeout: true
      - variables:
          # re-evaluate after the wait: the door may have been closed by hand meanwhile
          blocker: >-
            {%- set door = states('cover.ratgdo32_9a2c58_door') -%}
            {%- if hard_blocker != '' -%} {{ hard_blocker }}
            {%- elif not wait.completed -%} movement on the PTZ camera for 3 min
            {%- elif door != 'open' -%} door is {{ door }} now
            {%- elif is_state('input_boolean.nvr_garage_opened_by_ha', 'on') -%} HA arrival cycle in progress
            {%- elif is_state('binary_sensor.ratgdo32_9a2c58_obstruction', 'on') -%} obstruction reported
            {%- elif not armed -%} shadow mode
            {%- endif -%}
          will_close: "{{ blocker == '' }}"
          summary: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} departure PTZ->driveway
            armed={{ armed }} {{ 'CLOSING' if will_close else 'no-close: ' ~ blocker }}
      - action: input_text.set_value
        target:
          entity_id: input_text.nvr_last_departure_event
        data:
          value: "{{ summary[:255] }}"
      - action: __NOTIFY_SERVICE__
        data:
          title: "Known plate leaving"
          message: >-
            {{ 'closing the garage' if will_close
               else ('would close the garage (shadow mode: turn on NVR auto-close to enable)' if blocker == 'shadow mode'
                     else 'not closing: ' ~ blocker) }}
      - action: persistent_notification.create
        data:
          notification_id: nvr_departure
          title: "NVR known plate departure"
          message: "{{ summary }}"
      - if:
          - condition: template
            value_template: "{{ will_close }}"
        then:
          - action: cover.close_cover
            target:
              entity_id: cover.ratgdo32_9a2c58_door
          - wait_template: "{{ is_state('cover.ratgdo32_9a2c58_door', 'closed') }}"
            timeout: "00:00:30"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: nvr_departure
                  title: "NVR garage auto-close"
                  message: "The door did not report closed within 30 s of the HA close command (state: {{ states('cover.ratgdo32_9a2c58_door') }}). Check the opener."
              - action: __NOTIFY_SERVICE__
                data:
                  title: "Garage auto-close"
                  message: "The door did not report closed within 30 s (state: {{ states('cover.ratgdo32_9a2c58_door') }})."
