# cn-nvr host-local Prometheus (feeds grafana.cerberus.lan). No alert rules
# here: the VPS plane (cn-root-docker) owns alerting for cn-nvr.
# Targets inside the ts-nvr netns are reached through the sidecar's pinned
# bridge address 172.30.5.10 (docker-compose.yml). Labels mirror the fleet
# convention (host/stack/app); host is the machine name on this plane.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: cerberus
          stack: cn-nvr
          app: prometheus

  - job_name: node
    static_configs:
      - targets: ["172.30.5.10:9100"]
        labels:
          host: cerberus
          stack: cn-nvr
          app: node-exporter

  - job_name: frigate
    metrics_path: /api/metrics
    static_configs:
      - targets: ["172.30.5.10:5000"]
        labels:
          host: cerberus
          stack: cn-nvr
          app: frigate
