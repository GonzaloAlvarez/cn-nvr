# amun-docker resiliency manifest — installs a docker-compose@cn-nvr boot
# unit + an /etc/cron.d reconcile job. See amun-docker README.
# No nfs_mount: /srv is a local LVM volume; the stack's own mount-precheck
# service gates on it (amun-docker only knows how to gate NFS mounts).
boot:
  enabled: true
reconcile:
  enabled: true
  schedule: "*/5 * * * *"
