# cn-nvr Mosquitto — shared by Frigate (localhost in the ts-nvr netns) and
# Home Assistant (via traefik-lan's mqtt entrypoint, HA-only). No anonymous
# access; users come from mosquitto/passwd (rendered by setup.sh).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
